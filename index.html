<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GateFlow Pro – Sanjay Intl</title>
<style>
:root{--g:rgba(18,22,32,.85);--t:#f2ede5;--m:#9aa1b3;--a:#FF6A1A;--bd:rgba(255,255,255,.15);box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#070b14;font:13px system-ui,sans-serif;color:var(--t)}
canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:1;display:block;touch-action:none}
.gl{background:var(--g);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:10;position:relative}
#top{position:fixed;left:10px;right:10px;top:10px;display:flex;gap:10px;align-items:center;padding:8px 14px;z-index:10}
.logo{font-weight:750;letter-spacing:.4px}.logo b{color:var(--a)}.logo small{color:var(--m);font-weight:400;margin-left:6px}
#kpi{position:fixed;left:10px;top:65px;display:flex;gap:8px;z-index:10}
.k{padding:8px 12px;min-width:95px}.k small{color:var(--m);display:block;font-size:10px}.k b{font-size:16px}.k i{font-style:normal;color:var(--a);font-size:10px;margin-left:3px}
#bot{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;z-index:10;height:95px}
#info{flex:1;padding:10px 14px;overflow:auto;font-size:12px;line-height:1.4}
@media(max-width:760px){#kpi{top:60px}#bot{height:80px}}
</style></head><body>
<div id="top" class="gl"><div class="logo"><b>●</b> GateFlow Pro<small>AIエージェント＆リアルタイム3D</small></div></div>
<div id="kpi">
  <div class="gl k"><small>アクティブ乗客</small><b id="pCount">0</b><i>人</i></div>
  <div class="gl k"><small>運行車両</small><b id="vCount">4</b><i>台</i></div>
  <div class="gl k"><small>システムFPS</small><b id="fps">60</b><i>fps</i></div>
</div>
<div id="bot"><div id="info" class="gl"><b>[Mark & Andrew 共同開発サイクル2]</b> キャンバスの描画不具合を解消し、AIエージェントと車両、PBRライティングを完全統合しました。iPadウィジェットサイズに最適化されています。</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,PI=Math.PI;
const R=new T.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.setSize(innerWidth,innerHeight);
R.shadowMap.enabled=true;
R.shadowMap.type=T.PCFSoftShadowMap;
R.toneMapping=T.ACESFilmicToneMapping;
R.toneMappingExposure=1.3;
document.body.prepend(R.domElement);

const S=new T.Scene();
S.background=new T.Color(0x070b14);
S.fog=new T.FogExp2(0x070b14,.0022);

const cam=new T.PerspectiveCamera(32,innerWidth/innerHeight,1,1000);
cam.position.set(0,45,75);
cam.lookAt(0,0,0);

const hemi=new T.HemisphereLight(0xfff6ec,0x1b2838,1.2);S.add(hemi);
const sun=new T.DirectionalLight(0xfff0dd,2.0);
sun.position.set(50,80,30);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias=-0.0004;
S.add(sun);

// 床面・滑走路
const floorMat=new T.MeshStandardMaterial({color:0x111827,roughness:0.8,metalness:0.2});
const floor=new T.Mesh(new T.PlaneGeometry(300,200),floorMat);
floor.rotation.x=-PI/2;
floor.receiveShadow=true;
S.add(floor);

// ターミナル建物
const buildMat=new T.MeshStandardMaterial({color:0xe2e8f0,roughness:0.4});
const terminal=new T.Mesh(new T.BoxGeometry(100,10,22),buildMat);
terminal.position.set(0,5,-25);
terminal.castShadow=terminal.receiveShadow=true;
S.add(terminal);

const glassMat=new T.MeshStandardMaterial({color:0x7dd3fc,roughness:0.1,transparent:true,opacity:0.65,emissive:0x38bdf8,emissiveIntensity:0.2});
const glass=new T.Mesh(new T.BoxGeometry(96,7.5,0.8),glassMat);
glass.position.set(0,4.5,-14.2);
S.add(glass);

// 1人ずつ独立して動く乗客エージェント
const passengers=[];
const paxGeo=new T.BoxGeometry(0.7,1.7,0.7);
const paxMat=new T.MeshStandardMaterial({color:0xFF6A1A,roughness:0.3,metalness:0.1});

for(let i=0;i<30;i++){
  const mesh=new T.Mesh(paxGeo,paxMat);
  mesh.castShadow=true;
  const x=(Math.random()-0.5)*70;
  const z=Math.random()*35-8;
  mesh.position.set(x,0.85,z);
  S.add(mesh);
  
  passengers.push({
    mesh, x, z,
    targetX: (Math.random()-0.5)*70,
    targetZ: Math.random()*35-8,
    speed: 0.04 + Math.random()*0.04,
    wait: 0
  });
}
document.getElementById('pCount').textContent=passengers.length;

// 空港車両エージェント
const vehicles=[];
const vehGeo=new T.BoxGeometry(3.2,1.2,1.6);
const vehMat=new T.MeshStandardMaterial({color:0x38bdf8,roughness:0.4});

for(let i=0;i<4;i++){
  const mesh=new T.Mesh(vehGeo,vehMat);
  mesh.castShadow=true;
  const x=-40 + i*25;
  mesh.position.set(x,0.6,12);
  S.add(mesh);
  vehicles.push({ mesh, x, z:12, dir: i%2===0?1:-1, speed: 0.08 });
}

// アニメーションループ
const clock=new T.Clock();
let frameCount=0, lastTime=performance.now();

function animate(){
  requestAnimationFrame(animate);
  const dt=clock.getDelta();

  // FPS計測
  frameCount++;
  const now=performance.now();
  if(now - lastTime >= 1000){
    document.getElementById('fps').textContent=Math.round((frameCount * 1000) / (now - lastTime));
    frameCount=0; lastTime=now;
  }

  // 乗客の歩行AI
  passengers.forEach(p=>{
    if(p.wait > 0){ p.wait -= dt; return; }
    const dx=p.targetX - p.x;
    const dz=p.targetZ - p.z;
    const dist=Math.hypot(dx,dz);
    if(dist < 1){
      p.targetX=(Math.random()-0.5)*70;
      p.targetZ=Math.random()*35-8;
      p.wait=Math.random()*4;
    } else {
      p.x += (dx/dist)*p.speed;
      p.z += (dz/dist)*p.speed;
      p.mesh.position.set(p.x, 0.85, p.z);
      p.mesh.rotation.y = Math.atan2(dx, dz);
    }
  });

  // 車両の走行
  vehicles.forEach(v=>{
    v.x += v.dir * v.speed;
    if(Math.abs(v.x) > 55) v.dir *= -1;
    v.mesh.position.x = v.x;
    v.mesh.rotation.y = v.dir > 0 ? 0 : PI;
  });

  R.render(S,cam);
}
animate();

window.addEventListener('resize',()=>{
  R.setSize(innerWidth,innerHeight);
  cam.aspect=innerWidth/innerHeight;
  cam.updateProjectionMatrix();
});
</script></body></html>
