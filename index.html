<style>
:root{--g:rgba(255,252,246,.72);--t:#2a2622;--m:#7d7469;--a:#FF6A1A;--bd:rgba(255,255,255,.75);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const T=THREE,PI=Math.PI,$=s=>document.querySelector(s),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a),A=0xFF6A1A,W=0xf8f4ec;
const R=new T.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;
R.shadowMap.type=T.PCFSoftShadowMap;
R.outputEncoding=T.sRGBEncoding;
R.toneMapping=T.ACESFilmicToneMapping;
R.toneMappingExposure=1.1;
document.body.prepend(R.domElement);
const cv=R.domElement;

const S=new T.Scene();
S.fog=new T.FogExp2(0xeadecb,.0018);
S.background=new T.Color(0xeadecb);

const cam=new T.PerspectiveCamera(30,1,1,1000);
const hemi=new T.HemisphereLight(0xfff6ec,0x727860,.9);S.add(hemi);

const sun=new T.DirectionalLight(0xfff4e0,1.3);
sun.castShadow=true;
sun.shadow.mapSize.set(4096,4096);
const sc=sun.shadow.camera;sc.left=-150;sc.right=150;sc.top=110;sc.bottom=-110;sc.near=5;sc.far=600;
sun.shadow.radius=3;
sun.shadow.bias=-.0004;
S.add(sun,sun.target);

const flood=[[-30,12,-14],[30,12,-14],[-78,12,-4],[85,12,-6]].map(p=>{const l=new T.PointLight(0xffd390,0,80);l.position.set(...p);S.add(l);return l});

// ---------- materials & helpers
const MC={},M=(c,o)=>{if(typeof c=='object')return c;const k=c+JSON.stringify(o||0);return MC[k]||(MC[k]=new T.MeshStandardMaterial(Object.assign({color:c,roughness:.8},o)))};
const grass=M(0xb8c494,{roughness:.9}),tar=M(0x7a7670,{roughness:.75,metalness:.05}),road=M(0x5c5956,{roughness:.8}),glass=M(0x8bc9de,{transparent:true,opacity:.6,roughness:.1,metalness:.1,emissive:0xffb870,emissiveIntensity:.05}),win=M(0x1f2836,{roughness:.25,emissive:0xffc870,emissiveIntensity:0}),lamp=M(0xffffff,{emissive:0xfff0c0,emissiveIntensity:.5});
const base={grass:grass.color.clone(),tar:tar.color.clone(),road:road.color.clone()};

function B(w,h,d,c,x,y,z,p){const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||S).add(m);return m}
function C(rt,rb,h,c,x,y,z,p,s){const m=new T.Mesh(new T.CylinderGeometry(rt,rb,h,s||16),M(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||S).add(m);return m}
function inst(geo,mat,arr,col){const m=new T.InstancedMesh(geo,mat,arr.length),d=new T.Object3D();arr.forEach((p,i)=>{d.position.set(p[0],p[1],p[2]);d.rotation.y=p[3]||0;d.updateMatrix();m.setMatrixAt(i,d.matrix);if(col)m.setColorAt(i,new T.Color(col[i%col.length]))});m.castShadow=m.receiveShadow=true;S.add(m);return m}
function seg(x1,z1,x2,z2,w,c){const L=Math.hypot(x2-x1,z2-z1),m=B(L,.1,w,c,(x1+x2)/2,.06,(z1+z2)/2);m.rotation.y=-Math.atan2(z2-z1,x2-x1)}
function spr(t){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');x.fillStyle='#FF6A1A';x.fillRect(0,0,128,64);x.fillStyle='#fff';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText(t,64,46);const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true}));s.scale.set(4,2,1);return s}

// ---------- world
B(750,.4,550,grass,0,-.2,0).receiveShadow=true;
B(100,.1,34,tar,0,.05,-16);B(64,.1,28,tar,-78,.05,-8);B(32,.1,26,tar,85,.05,-11);B(14,.1,30,tar,53,.05,-14);
B(230,.1,9,tar,-30,.05,-34);B(9,.1,18,tar,-76,.05,-43);B(9,.1,18,tar,44,.05,-43);B(300,.1,13,tar,0,.05,-52);
B(180,.04,.35,A,-30,.12,-34);
inst(new T.BoxGeometry(3,.05,.4),M(W),Array.from({length:38},(_,i)=>[-126+i*7,.12,-52]));
inst(new T.SphereGeometry(.25,10,8),lamp,Array.from({length:68},(_,i)=>[-132+(i>>1)*8,.28,-52+(i&1?6.5:-6.5)]));
B(110,.1,18,road,0,.05,28);B(420,.1,15,road,0,.05,50);B(52,.1,26,tar,82,.05,35);
[[-75,47,-56,40],[-56,40,-48,24],[75,47,56,40],[56,40,48,24]].forEach(a=>seg(...a,5.5,road));
B(96,.15,3.2,0xe2dbcc,0,.08,17.5);

// terminal
const GX=[-32,-16,0,16,32];
B(92,7.2,15,W,0,3.6,8);B(92,5.2,.6,glass,0,3.5,.7);B(98,.9,20,W,0,7.6,7.5);B(98,.5,.8,A,0,7.2,-1.8);B(92,.3,.4,0x3a4048,0,.9,.4);
GX.forEach((x,i)=>{const s=spr('G'+(i+1));s.position.set(x,9.6,-1.6);S.add(s)});

// tower
C(1.6,2.4,19,W,54,9.5,8);C(3.2,2.4,3.8,glass,54,20.2,8);C(3.8,3.8,.7,A,54,22.3,8);C(.12,.12,4.5,0x444,54,24.8,8);

// cargo terminal
B(38,6.2,17,W,-78,3.1,12);B(38,.8,17.4,A,-78,6.3,12);for(let i=0;i<6;i++)B(4.2,4.2,.35,0x3e4650,-92+i*5.8,2.1,3.9);
inst(new T.BoxGeometry(2.6,1.8,2),M(0xffffff),Array.from({length:9},(_,i)=>[-94+(i%3)*2.9,1.0+(i>5?1.8:0),-3.5+((i/3)|0)*2.3]),[0xd2d6dc,0xe0e4ec,0xc8ccd2]);

// hangar
B(32,.9,1,0xc4bcac,85,4.8,1);B(1.2,9.5,23,0xc4bcac,70.1,4.8,-10);B(1.2,9.5,23,0xc4bcac,99.9,4.8,-10);B(34,1.1,25,W,85,10,-10);B(34,.6,.9,A,85,9.7,-22.8);

// palms & parking
function palm(x,z){const g=new T.Group(),t=C(.28,.38,5.5,0x8c6c4c,0,2.75,0,g,8);t.rotation.z=rnd(-.15,.15);for(let i=0;i<6;i++){const l=B(.45,.09,3.2,0x5c8a48,Math.cos(i)*1.3,5.6,Math.sin(i)*1.3,g);l.rotation.y=-i;l.rotation.z=.38}g.position.set(x,0,z);S.add(g)}
for(let x=-45;x<=45;x+=15)palm(x,19.5);for(let i=0;i<10;i++)palm(62+i*5,45);for(let i=0;i<8;i++){palm(-120+i*12,40);palm(110+i*8,40)}
inst(new T.BoxGeometry(3.6,1.2,1.7),M(0xffffff),Array.from({length:30},(_,i)=>[64+(i%10)*4.4,.6,27+((i/10)|0)*6,PI/2*0]),[0xecceb0,0xb2cddc,0xf5eee2,0xe09878,0xaec4a8,0xd6d6d6]);

// ---------- aircraft
function plane(tailC,bodyC){const g=new T.Group(),m=new T.Group(),gr=new T.Group();g.add(m,gr);
const bm=new T.MeshStandardMaterial({color:bodyC||W,roughness:.5,metalness:.1}),dk=M(0x1e242c,{roughness:.3}),gm=M(0x555,{roughness:.5});
const f=C(1.25,1.25,10.5,bm,0,2.5,0,m,18);f.rotation.z=PI/2;
const n=new T.Mesh(new T.SphereGeometry(1.25,18,14),bm);n.scale.x=1.5;n.position.set(5.2,2.5,0);n.castShadow=true;m.add(n);
const tc=C(.32,1.25,4.2,bm,-7.2,2.65,0,m,16);tc.rotation.z=PI/2;
[-1,1].forEach(s=>{const w=B(3.2,.16,7.4,bm,-.8,2.1,s*3.8,m);w.rotation.y=-s*.4;B(1,1.4,.13,A,-2.3,2.8,s*7.2,m);
const e=C(.58,.52,1.9,0xafb3bc,.8,1.45,s*2.7,m);e.rotation.z=PI/2;const iv=C(.44,.44,.07,dk,1.8,1.45,s*2.7,m);iv.rotation.z=PI/2;
B(1.7,.13,3,bm,-8.2,3.0,s*1.7,m);
for(let x=-4.2;x<=3.8;x+=.85)B(.38,.32,.06,win,x,3.0,s*1.28,m);
const lg=C(.58,.58,.06,W,-6.8,4.7,s*.1,m);lg.rotation.x=PI/2;
[[-.6,s*1.9]].forEach(p=>{C(.12,.12,1.1,gm,p[0],.9,p[1],gr);const w2=C(.38,.38,.3,dk,p[0],.4,p[1],gr);w2.rotation.x=PI/2})});
const fin=B(2.5,3.2,.19,tailC,-7.0,4.7,0,m);fin.rotation.z=.35;B(1.3,.48,2.0,dk,5.8,3.1,0,m);
C(.12,.12,1.1,gm,4.0,.9,0,gr);const nw=C(.34,.34,.28,dk,4.0,.4,0,gr);nw.rotation.x=PI/2;
return{g,m,gr,bm}}

// ---------- vehicles
function veh(k,c){const D={fuel:[4.4,1.3,2],cater:[4.6,1.6,2.1],bus:[4,1.2,1.9],cart:[3.8,.55,1.4],tug:[2.8,.9,1.7],fork:[2.1,.95,1.3],deice:[4.6,1.4,2.1],taxi:[3.6,.85,1.6],auto:[2,.95,1.2],car:[3.4,.85,1.6],abus:[7.5,2,2.3]}[k],[L,h,Wd]=D,g=new T.Group(),o={r:Math.max(1.5,L*.42)};
B(L,h,Wd,c,0,.5+h/2,0,g);
if(k=='car'||k=='taxi'||k=='auto')B(L*.58,.65,Wd*.92,k=='auto'?A:glass,-L*.05,.5+h+.32,0,g);
else if(k=='bus'||k=='abus')B(L*.92,h*.48,Wd+.08,glass,0,.5+h*.62,0,g);
else if(k!='cart'&&k!='fork')B(L*.3,h*.9,Wd*.96,W,L*.38,.5+h+h*.42,0,g);
if(k=='fuel'){const t=C(.78,.78,L*.64,W,-L*.1,.5+h+.82,0,g,14);t.rotation.z=PI/2;const s=C(.8,.8,.42,A,-L*.1,.5+h+.82,0,g,14);s.rotation.z=PI/2}
if(k=='cater'){o.lift=B(2.5,1.8,Wd-.1,W,-.5,.5+h+1.05,0,g)}
if(k=='deice'){B(2.7,.32,.42,A,-.4,3.3,0,g);o.spray=new T.Mesh(new T.ConeGeometry(2.5,7.5,12,1,true),new T.MeshBasicMaterial({color:A,transparent:true,opacity:.32,side:2}));o.spray.rotation.z=-PI/2;o.spray.position.set(-4.6,3.9,0);o.spray.visible=false;g.add(o.spray)}
if(k=='cart')for(let i=0;i<4;i++)B(.95,.65,.95,[0x4c7088,0xbc704c,0x6c7c4c,0x7c5c8c][i],-1.3+i*.85,1.15,0,g);
if(k=='fork'){B(.95,.12,.95,0x444,L/2+.45,.5,0,g);B(.13,2.1,1.05,0x444,L/2,1.55,0,g);B(1.3,1.05,1.05,0xd2d6dc,L/2+.65,1.25,0,g)}
const ws=k=='auto'?[[L*.3,0],[-L*.3,-Wd/2],[-L*.3,Wd/2]]:[[L*.32,-Wd/2],[L*.32,Wd/2],[-L*.32,-Wd/2],[-L*.32,Wd/2]];
ws.forEach(w=>{const q=C(.42,.42,.32,0x222,w[0],.4,w[1],g,12);q.rotation.x=PI/2});
o.g=g;S.add(g);return o}

// ---------- sim core
let SIM=0,UID=0,hour=9.33;const MV=[],ENT=[],TM=[],AC=[],GATES=[];
const sleep=s=>new Promise(r=>TM.push([s,r])),until=async f=>{while(!f())await sleep(.3)},ramp=async(o,k,to,d)=>{const f=o[k]||0,t0=SIM;while(SIM-t0<d){o[k]=f+(to-f)*(SIM-t0)/d;await sleep(.1)}o[k]=to};
const alerts=[];function log(m){const t=$('#clk').textContent;alerts.unshift([t,m]);$('#bc').textContent=alerts.length;$('#al').innerHTML=alerts.slice(0,30).map(a=>`<div><small>${a[0]}</small> ${a[1]}</div>`).join('')}

class Mv{constructor(o,spd,r,pr,x){this.o=o;this.spd=spd;this.r=r;this.pr=pr;this.cur=0;this.pts=null;this.i=0;this.w=0;this.id=UID++;this.ign=[];this.rev=false;this.on=true;this.tr=3;this.st='待機';Object.assign(this,x);o.userData.ent=this;MV.push(this);ENT.push(this);if(this.hide)o.visible=false}
go(pts,spd,rev){return new Promise(r=>{this.pts=pts;this.i=0;this.s=spd||this.spd;this.rev=!!rev;this.res=r})}
blocked(){const o=this.o,f1=[Math.cos(o.rotation.y),-Math.sin(o.rotation.y)];for(const q of MV){if(q===this||!q.on||!q.o.visible||this.ign.includes(q))continue;const dx=q.o.position.x-o.position.x,dz=q.o.position.z-o.position.z,d=Math.hypot(dx,dz),lim=this.r+q.r+1.6+this.cur*.5;if(d>lim)continue;const f2=[Math.cos(q.o.rotation.y),-Math.sin(q.o.rotation.y)],ahead=(dx*f1[0]+dz*f1[1])/d,lat=Math.abs(dx*f1[1]-dz*f1[0]);if(ahead<.55||lat>this.r+q.r-.2)continue;const same=f1[0]*f2[0]+f1[1]*f2[1];if(same>.5||q.pr>this.pr||(q.pr==this.pr&&q.id<this.id))return true}return false}
upd(dt){const o=this.o;this.on=o.position.y<2;if(this.att)return;if(this.w>0){this.w-=dt;this.cur=0;if(this.w<=0)o.visible=true;return}
if(!this.pts)return this.cur=0;o.visible=true;const p=this.pts[this.i];let dx=p[0]-o.position.x,dz=p[1]-o.position.z,d=Math.hypot(dx,dz);
if(d<.6){if(p[2])this.w=p[2];if(++this.i>=this.pts.length){if(this.loop){this.i=1;o.position.set(this.pts[0][0],0,this.pts[0][1])}else{const f=this.res;this.pts=null;f&&f()}}return}
let da=0;if(!this.rev){da=((Math.atan2(-dz,dx)-o.rotation.y+PI*3)%(PI*2))-PI;o.rotation.y+=da*Math.min(1,dt*this.tr)}
let t=this.s*(1-Math.min(.7,Math.abs(da)/2));if(p[2]&&d<6)t*=Math.max(.3,d/6);if(this.i==this.pts.length-1&&!this.loop&&!this.air)t*=Math.max(.35,Math.min(1,d/5));

function trk(){const a=sel&&sel.type=='航空機'?sel:AC.find(x=>x.gate)||AC[0];if(!a||!a.st0.length||!a.gate&&a.stage<1){$('#trk').innerHTML='<h4>ターンアラウンド</h4><div class=st>ゲート待ちの機材なし</div>';return}
const N=['オンブロック','降機','清掃・ケータリング','給油','搭乗','プッシュバック'];$('#trk').innerHTML=`<h4>ターンアラウンド · ${a.flight} · ${a.reg}${a.gate?' · G'+a.gate.i:''}</h4>`+N.map((n,i)=>{const s=a.st0[i]||{},d=s.e!==undefined&&s.e,act=s.s!==undefined&&!d&&a.gate,t=d?Math.round(s.e-s.s):act?Math.round(SIM-s.s):0;return `<div class="st ${d?'d':act?'a':''}"><span>${n}</span><span>${d||act?t+' 分':'—'}</span></div>`}).join('')}

setInterval(()=>{det();tbl();trk();const occ=GATES.filter(g=>g.occ).length;$('#k2').textContent=occ+'/5';$('#k3').textContent=turns?Math.round(sumT/turns)+' 分':'— 分';$('#k1').textContent=(Math.max(80,93.2-delays*2.1+Math.sin(SIM/40))).toFixed(1)+'%'},400);

// ---------- loop
function size(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',size);size();
const clk=new T.Clock(),v3=new T.Vector3();

function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clk.getDelta());SIM+=dt;
for(let i=TM.length-1;i>=0;i--){TM[i][0]-=dt;if(TM[i][0]<=0){TM[i][1]();TM.splice(i,1)}}
MV.forEach(m=>m.upd(dt));
AC.forEach(a=>{const y=a.o.position.y;a.gear.visible=y<3;a.gear.scale.setScalar(cl(1.6-y/2.2,0,1)+.001);a.bm.color.lerp(new T.Color(a.deiced?0xffe0c4:W),.05);if(a.tug){const r=a.o.rotation.y;a.tug.o.position.set(a.o.position.x+Math.cos(r)*6.1,0,a.o.position.z-Math.sin(r)*6.1);a.tug.o.rotation.y=r+PI}});
GATES.forEach(g=>{g.e+=(g.t-g.e)*dt*1.4;g.pv.scale.z=9.6*g.e});DEI.o.visible=wx=='snow';
env(dt);

if(G){const k=Math.min(1,dt*2.2);C0.tx+=(G.tx-C0.tx)*k;C0.tz+=(G.tz-C0.tz)*k;C0.d+=(G.d-C0.d)*k;C0.yaw+=(G.yaw-C0.yaw)*k;C0.pit+=(G.pit-C0.pit)*k}
if(sel&&follow){const p=sel.o.position;C0.tx+=(p.x-C0.tx)*Math.min(1,dt*3);C0.tz+=(p.z-C0.tz)*Math.min(1,dt*3)}

const cp=Math.cos(C0.pit);cam.position.set(C0.tx+C0.d*Math.sin(C0.yaw)*cp,C0.d*Math.sin(C0.pit),C0.tz+C0.d*Math.cos(C0.yaw)*cp);cam.lookAt(C0.tx,0,C0.tz);
sun.target.position.set(C0.tx,0,C0.tz);sun.position.add(sun.target.position);

if(sel){const p=sel.o.position;ring.position.set(p.x,.4,p.z);const s=(sel.type=='スタンド'?3:sel.type=='航空機'?2.8:1.1)*(1+.12*Math.sin(SIM*5));ring.scale.setScalar(s);v3.set(p.x,(sel.type=='航空機'?6:4)+p.y,p.z).project(cam);const f=$('#fl');f.style.display=v3.z<1?'block':'none';f.style.left=(v3.x*.5+.5)*innerWidth+'px';f.style.top=(-v3.y*.5+.5)*innerHeight+'px';f.textContent=sel.type=='航空機'?sel.flight+' · '+sel.st:sel.name}
R.render(S,cam)}

AC.forEach(life);log('GateFlow 稼働開始 — サンジャイ国際空港');frame();
})();
